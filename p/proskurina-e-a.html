<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark light"><title>Проскурина Е.А. — расписание</title><meta name="description" content="Расписание занятий Губкинского горно-политехнического колледжа"><link rel="icon" type="image/svg+xml" href="../icons/favicon.svg"><link rel="icon" type="image/png" sizes="32x32" href="../icons/icon32.png"><link rel="icon" type="image/png" sizes="192x192" href="../icons/icon192.png"><link rel="apple-touch-icon" href="../icons/icon192.png"><link rel="stylesheet" href="../fonts.css"><style>
:root{--bg:#100f0e;--card:#191715;--card2:#232020;--line:#292624;--line2:#3b3834;
--text:#f5f2ed;--muted:#a9a29a;--pill:#efb44b;--pill-text:#221a08;--accent:#f2c14e;--seg:#2c2926;
--grid:#242120;--warn-bg:color-mix(in srgb,var(--accent) 13%,var(--card));--warn-line:color-mix(in srgb,var(--accent) 42%,var(--line));--warn-text:color-mix(in srgb,var(--accent) 78%,var(--text));--head:rgba(16,15,14,.72);
--shadow:0 1px 2px rgba(0,0,0,.4),0 14px 36px -14px rgba(0,0,0,.6);
--shadow-soft:0 10px 30px -14px rgba(0,0,0,.55)}
html[data-accent=raspberry]{--pill:#e25c7f;--pill-text:#2b0812;--accent:#f28ea3}
html[data-accent=mint]{--pill:#46cf9f;--pill-text:#06251a;--accent:#7fdebb}
html[data-accent=sky]{--pill:#58a6f2;--pill-text:#061c31;--accent:#8fc3f7}
html[data-accent=lavender]{--pill:#9b87f0;--pill-text:#17102e;--accent:#bdaef6}
html[data-accent=coral]{--pill:#f4795b;--pill-text:#2d0f06;--accent:#f7a288}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 'Manrope',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;-webkit-tap-highlight-color:transparent}
::selection{background:color-mix(in srgb,var(--accent) 38%,transparent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.scrollx{scrollbar-width:thin;scrollbar-color:var(--line2) transparent}
.wrap{max-width:680px;margin:0 auto;padding:0 18px 96px}
a{color:inherit;text-decoration:none}
a:hover{text-decoration:none}
.hdr{position:sticky;top:0;z-index:20;background:var(--head);backdrop-filter:blur(18px) saturate(1.15);border-bottom:1px solid var(--line)}
.hin{max-width:680px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:12px 18px}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.brand .mark{width:38px;height:38px;flex:none;display:flex;align-items:center;justify-content:center;color:var(--text)}
.brand .mark svg{width:100%;height:100%;display:block;border-radius:11px}
.brand b{display:block;font-size:15.5px;font-weight:750;line-height:1.2;letter-spacing:-.015em}
.tools{margin-left:auto;display:flex;align-items:center;gap:5px}
.ic{display:inline-flex;align-items:center;justify-content:center;gap:6px;width:38px;height:38px;border-radius:12px;border:1px solid var(--line2);background:transparent;color:var(--text);font-size:13px;cursor:pointer;font-family:inherit;flex:none;transition:background .15s ease-out,border-color .15s ease-out,transform .15s ease-out}
.ic svg{display:block}
@media (hover:hover){.ic:hover{background:var(--card2);border-color:var(--line2)}}
.ic:active{transform:scale(.96)}
.ic.acc{color:var(--accent)}
.pmenu{position:fixed;top:64px;right:12px;z-index:60;display:none;flex-direction:column;gap:2px;min-width:214px;padding:10px;background:var(--card);border:1px solid var(--line2);border-radius:16px;box-shadow:var(--shadow-soft)}
.pmenu.on{display:flex}
.pmenu-t{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:650;padding:2px 4px 8px}
.prow{display:flex;align-items:center;gap:11px;padding:9px 10px;border:0;border-radius:11px;background:transparent;color:var(--text);font:inherit;font-size:14px;font-weight:600;cursor:pointer;text-align:left}
@media (hover:hover){.prow:hover{background:var(--card2)}}
.prow .dot{width:22px;height:22px;border-radius:50%;flex:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.22)}
.prow .ck{margin-left:auto;color:var(--muted);display:none;flex:none}
.prow.act{background:var(--card2)}
.prow.act .ck{display:inline-flex}
h1{font-size:clamp(28px,6.5vw,40px);line-height:1.08;letter-spacing:-.02em;font-weight:800;margin:28px 0 16px;text-wrap:balance}
.sem{color:var(--muted);font-size:13.5px;font-weight:650;margin:-6px 0 14px;letter-spacing:.01em}
.sub{color:var(--muted);font-size:13.5px;margin:4px 0 6px;text-wrap:pretty}
.mine{display:flex;align-items:center;gap:11px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px 17px;margin:0 0 14px;font-weight:650;font-size:14.5px}
.mine::before{content:'';width:8px;height:8px;border-radius:50%;background:var(--accent);flex:none}
.mine span{color:var(--muted);font-size:13px;font-weight:500;margin-left:auto}
.search{display:flex;align-items:center;gap:11px;background:var(--card);border:1px solid var(--line2);border-radius:16px;padding:13px 16px;margin:0 0 14px;color:var(--muted);transition:border-color .15s ease-out,box-shadow .15s ease-out}
.search:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
.search input{flex:1;background:none;border:0;outline:none;color:var(--text);font-size:16px;font-family:inherit;min-width:0}
.search input::placeholder{color:var(--muted)}
.ccs{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;margin-bottom:14px;scrollbar-width:none}
.ccs::-webkit-scrollbar{display:none}
.cc{display:inline-flex;white-space:nowrap;padding:9px 16px;border-radius:999px;background:transparent;border:1px solid var(--line2);font-size:14px;color:var(--text);cursor:pointer;transition:background .15s ease-out,color .15s ease-out,border-color .15s ease-out}
.cc.on{background:var(--pill);color:var(--pill-text);border-color:var(--pill);font-weight:650}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media (max-width:720px){.grid{grid-template-columns:repeat(2,1fr)}}
@media (max-width:360px){.grid{grid-template-columns:1fr}}
.gcard{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:17px 15px;border-radius:16px;background:var(--card);border:1px solid var(--line);font-size:15px;font-weight:650;letter-spacing:-.01em;transition:background .15s ease-out,border-color .15s ease-out,transform .15s ease-out}
@media (hover:hover){.gcard:hover{border-color:var(--line2);background:var(--card2);transform:translateY(-2px)}}
.gcard:active{transform:scale(.96)}
.gcard svg{color:var(--muted);flex:none}
.gcard.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 9%,var(--card))}
h2.course{font-size:12.5px;color:var(--muted);font-weight:650;margin:26px 0 10px;text-transform:uppercase;letter-spacing:.06em}
.rows{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;margin-bottom:10px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:17px 16px;border-bottom:1px solid var(--line);font-weight:650;color:var(--text);cursor:pointer;transition:background .15s ease-out}
.row:last-child{border-bottom:0}
@media (hover:hover){.row:hover{background:var(--card2)}}
.row span{color:var(--muted);font-size:13px;font-weight:500}
.tabs{display:flex;gap:4px;margin:16px 0 14px;padding:4px;background:var(--card2);border:1px solid var(--line);border-radius:14px}
.tabs button{flex:1;padding:11px 8px;border:0;border-radius:11px;background:transparent;color:var(--muted);font-size:14px;font-weight:600;font-family:inherit;cursor:pointer;transition:background .18s,color .18s}
.tabs button.on{background:var(--seg);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.25)}
.banner{border-radius:14px;padding:13px 15px;font-size:14px;line-height:1.45;margin:12px 0 6px;border:1px solid var(--line);background:var(--card);display:flex;align-items:center;gap:10px;color:var(--muted)}
.banner.changed{border-color:var(--warn-line);background:var(--warn-bg);color:var(--warn-text)}
.banner svg{flex:none}
.tp-row{display:flex;align-items:center;gap:10px;margin:14px 0 2px;min-height:44px}
.tpb{flex:1;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 14px 13px}
.tpb-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.tpb-lbl{font-size:13.5px;font-weight:600}
.tpb-val{font-family:'ui-monospace',SFMono-Regular,Consolas,'Roboto Mono',monospace;font-size:14px;font-weight:700;color:var(--accent);letter-spacing:.3px}
.tpb-track{margin-top:10px;height:8px;border-radius:999px;background:#2a2724;overflow:hidden}
.tpb-fill{height:100%;border-radius:999px;background:var(--accent)}
.tpb-sub{margin-top:7px;display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted)}
.tp{display:inline-flex;align-items:center;gap:12px;padding:8px 8px 8px 16px;border-radius:999px;background:var(--card);border:1px solid var(--line)}
.tp .lbl{font-size:13px;color:var(--muted)}
.tp .val{font-family:'ui-monospace',SFMono-Regular,Consolas,'Roboto Mono',monospace;font-size:14px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:.02em;background:var(--pill);color:var(--pill-text);padding:7px 13px;border-radius:999px}
.tp.done{width:44px;height:44px;padding:0;border-radius:50%;background:var(--pill);border:0;justify-content:center}
.tp.done svg{color:var(--pill-text)}
.tp.warn{width:44px;height:44px;padding:0;border-radius:50%;background:var(--warn-bg);border:0;justify-content:center}
.tp.warn svg{color:var(--warn-text)}
.tp-text{font-size:14.5px;font-weight:650}
.day{margin:26px 4px 10px;font-size:15.5px;font-weight:700;letter-spacing:-.01em}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:18px;background:var(--card);box-shadow:var(--shadow-soft);margin-bottom:16px;scrollbar-width:none}
.tw::-webkit-scrollbar{display:none}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:14px;min-width:520px}
th{background:transparent;color:var(--muted);font-weight:650;text-align:left;padding:13px 12px 10px;font-size:11px;text-transform:uppercase;letter-spacing:.07em;border-bottom:1px solid var(--line2)}
td{padding:13px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tbody tr:last-child td{border-bottom:0}
tbody tr:nth-child(even) td{background:color-mix(in srgb,var(--card2) 42%,transparent)}
@media (hover:hover){tbody tr:hover td{background:var(--card2)}}
.back{display:inline-flex;align-items:center;gap:9px;padding:10px 18px 10px 13px;border-radius:999px;background:var(--card);border:1px solid var(--line2);font-size:14px;font-weight:650;color:var(--text);margin-top:16px;transition:background .15s ease-out,border-color .15s ease-out}
@media (hover:hover){.back:hover{background:var(--card2)}}
.back:active{transform:scale(.96)}
td.n{color:var(--muted);width:34px;text-align:center;font-family:'ui-monospace',SFMono-Regular,Consolas,monospace;font-size:12px;font-variant-numeric:tabular-nums}
td.t{white-space:nowrap;width:98px;font-family:'ui-monospace',SFMono-Regular,Consolas,monospace;font-size:13px;font-weight:650;color:var(--text);font-variant-numeric:tabular-nums}
td.s{min-width:176px;font-weight:650;font-size:14.5px;line-height:1.4;text-wrap:pretty}
td.r{white-space:nowrap;color:var(--muted);width:64px}
.tag{display:inline-block;max-width:100%;padding:3px 9px;border-radius:999px;background:var(--card2);border:1px solid var(--line);color:var(--muted);font-family:'ui-monospace',SFMono-Regular,Consolas,monospace;font-size:11px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.35;white-space:nowrap;margin-bottom:3px}
.tag:last-child{margin-bottom:0}
.tag.none{background:none;border:0;padding:0}
td.p{color:var(--muted);width:132px;font-size:13px;line-height:1.4}
.muted{color:var(--muted)}
.switch{display:flex;gap:4px;margin:10px 0 4px;padding:4px;background:var(--card2);border:1px solid var(--line);border-radius:14px}
.switch button{flex:1;padding:10px;border:0;border-radius:10px;background:transparent;color:var(--muted);font-size:14px;font-weight:600;font-family:inherit;cursor:pointer;transition:background .15s ease-out,color .15s ease-out}
.switch button.on{background:var(--seg);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.25)}
.empty{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;color:var(--muted);line-height:1.5;text-wrap:pretty}
input.q{width:100%;padding:13px 16px;border-radius:16px;border:1px solid var(--line2);background:var(--card);color:var(--text);font-size:16px;margin:0 0 14px;font-family:inherit;outline:none;transition:border-color .15s ease-out,box-shadow .15s ease-out}
input.q:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
.foot{margin:28px 0 10px;color:var(--muted);font-size:12.5px;text-align:center}
.foot a{color:var(--muted);text-decoration:none;padding:6px 10px;margin:-6px -10px;border-radius:10px;transition:color .15s ease-out}
@media (hover:hover){.foot a:hover{color:var(--text)}}
.foot a:active{opacity:.75}
.bottom{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;gap:3px;padding:5px;background:color-mix(in srgb,var(--card) 88%,transparent);border:1px solid var(--line2);border-radius:999px;box-shadow:var(--shadow);z-index:30;backdrop-filter:blur(18px) saturate(1.15)}
.bottom a{display:flex;align-items:center;gap:8px;padding:11px 18px;border-radius:999px;color:var(--muted);font-size:14px;font-weight:650;white-space:nowrap;transition:background .15s ease-out,color .15s ease-out}
.bottom a.on{background:var(--pill);color:var(--pill-text)}
.bottom a:active{transform:scale(.96)}
.modal{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:20px;background:color-mix(in srgb,var(--bg) 58%,transparent);backdrop-filter:blur(10px);opacity:0;pointer-events:none;transition:opacity .22s ease}
.modal.on{opacity:1;pointer-events:auto}
.mcard{width:100%;max-width:370px;background:var(--card);border:1px solid var(--line2);border-radius:24px;padding:26px 22px 18px;text-align:center;box-shadow:var(--shadow);overscroll-behavior:contain;transform:translateY(18px) scale(.94);opacity:0;transition:transform .3s cubic-bezier(.16,.9,.3,1.25),opacity .22s ease}
.modal.on .mcard{transform:none;opacity:1}
.micon{display:flex;align-items:center;justify-content:center;width:84px;height:84px;border-radius:50%;overflow:hidden;background:var(--card2);border:1px solid var(--line2);box-shadow:var(--shadow-soft);margin:0 auto 14px}
.micon svg{width:100%;height:100%;display:block;border-radius:50%}
.mtitle{font-size:18.5px;font-weight:750;margin-bottom:8px;line-height:1.3;letter-spacing:-.01em;text-wrap:balance}
.mtext{font-size:13.5px;color:var(--muted);margin-bottom:20px;line-height:1.55;text-wrap:pretty}
.mbtn{display:block;padding:14px;border-radius:15px;background:var(--pill);color:var(--pill-text);font-weight:700;margin-bottom:8px;transition:transform .15s ease-out,opacity .15s ease-out}
.mbtn:active{transform:scale(.96)}
.mno{width:100%;padding:12px;border-radius:15px;border:1px solid var(--line2);background:transparent;color:var(--muted);font-family:inherit;font-size:14px;cursor:pointer;transition:background .15s ease-out,color .15s ease-out,transform .15s ease-out}
.mno:active{transform:scale(.96)}
@media (hover:hover){.mno:hover{background:var(--card2);color:var(--text)}}
.toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);opacity:0;pointer-events:none;max-width:calc(100% - 28px);background:var(--card);border:1px solid var(--line2);color:var(--text);padding:11px 16px;border-radius:14px;font-size:13.5px;line-height:1.45;text-align:center;z-index:120;box-shadow:var(--shadow);transition:opacity .18s ease,transform .26s cubic-bezier(.16,.9,.3,1.25)}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){
*{transition-duration:.001s!important}
.mcard,.modal.on .mcard,.toast{transform:none!important}
.gcard:active,.ic:active,.mbtn:active,.mno:active,.back:active,.bottom a:active{transform:none}
}

const G='proskurina-e-a', NAME='Проскурина Е.А.', MODE='t';
const MONTHS=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
let data=null, tab='today', parity='n';
const $=s=>document.querySelector(s);
function iso(d){const p=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate());}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function table(rows){
  const h5=(MODE==='t')?'Пара':'Преподаватель';
  const tag=v=>(v&&v!=='—')?'<span class="tag">'+v+'</span>':'<span class="tag none">—</span>';
  const RX=/^[0-9][0-9-]*[а-яёa-z]{0,2}$/i;
  const rv=v=>{ if(!v||v==='—') return '<span class="tag none">—</span>';
    const t=v.split(/\s+/);
    if(t.length>1&&t.every(function(x){return RX.test(x);})) return t.map(function(x){return '<span class="tag">'+x+'</span>';}).join('<br>');
    return '<span class="tag">'+v+'</span>'; };
  let h='<div class="tw"><table><thead><tr><th>№</th><th>Время</th><th>'+(MODE==='t'?'Группа':'Пара')+'</th><th>Ауд.</th><th>'+h5+'</th></tr></thead><tbody>';
  if(!rows.some(r=>r[0]===1)&&rows.length){
    h+='<tr><td class="n">1</td><td class="t"><span class="tag none">—</span></td><td class="s"><span class="tag none">—</span></td><td class="r"><span class="tag none">—</span></td><td class="p"><span class="tag none">—</span></td></tr>';
  }
  for(const r of rows){
    const c3=esc(r[2])||'—', c4=esc(r[3])||'—', c5=esc(r[4])||'—';
    if(MODE==='t'){
      h+='<tr><td class="n">'+r[0]+'</td><td class="t">'+(r[1]||'<span class="tag none">—</span>')+'</td><td class="s">'+c3+'</td><td class="r">'+rv(c5)+'</td><td class="s">'+c4+'</td></tr>';
    }else{
      h+='<tr><td class="n">'+r[0]+'</td><td class="t">'+(r[1]||'<span class="tag none">—</span>')+'</td><td class="s">'+c3+'</td><td class="r">'+rv(c4)+'</td><td class="p">'+c5+'</td></tr>';
    }
  }
  return h+'</tbody></table></div>';
}
function banner(status){
  if(status==='changed') return '<div class="banner changed"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 17h11l-1.3-2.2V10a4.2 4.2 0 1 0-8.4 0v4.8z"/><path d="M10.3 19.5a1.9 1.9 0 0 0 3.4 0"/></svg> Учтены изменения на эту дату.</div>';
  if(status==='empty') return '<div class="banner">Без изменений.</div>';
  return '<div class="banner none">Изменений на эту дату в сообществе пока нет.</div>';
}
function parseSlots(rows){
  const out=[];
  (rows||[]).forEach(function(r){
    const parts=String(r[1]||'').split('<br>');
    const sl=[];
    parts.forEach(function(p){
      const m=p.replace(/–/g,'-').match(/(\d{1,2}):(\d{2})-(\d{1,2}):(\d{2})/);
      if(m) sl.push([+m[1]*60 + +m[2], +m[3]*60 + +m[4]]);
    });
    if(sl.length) out.push({pair:r[0], slots:sl});
  });
  return out;
}

function femGen(n){
  const m={1:'1-ой',2:'2-ой',3:'3-ей',4:'4-ой',5:'5-ой',6:'6-ой'};
  return m[n]||n+'-ой';
}
function mascGen(n){
  const m={1:'1-го',2:'2-го',3:'3-го',4:'4-го',5:'5-го',6:'6-го'};
  return m[n]||n+'-го';
}
function buildSegs(rows){
  const pairs=parseSlots(rows), segs=[];
  let cursor=0; // 00:00 — отсчёт до начала занятий идёт с полуночи
  pairs.forEach(function(p, idx){
    const isLast=(idx===pairs.length-1);
    const s1=p.slots[0], s2=p.slots[1];
    if(s1[0] > cursor){
      segs.push({a:cursor, b:s1[0], label: idx===0 ? 'До начала занятий'
        : 'До ' + mascGen(1) + ' часа ' + femGen(p.pair) + ' пары'});
    }
    const firstLabel = (!s2 && isLast) ? 'До конца последней пары' : 'До перемены';
    segs.push({a:s1[0], b:s1[1], label:firstLabel});
    if(s2){
      if(s2[0] > s1[1]){
        segs.push({a:s1[1], b:s2[0], label:'До ' + mascGen(2) + ' часа ' + femGen(p.pair) + ' пары'});
      }
      segs.push({a:s2[0], b:s2[1], label: isLast ? 'До конца последней пары' : 'До перемены'});
      cursor=s2[1];
    } else {
      cursor=s1[1];
    }
  });
  return {segs:segs, end:cursor, first:segs.length?segs[0].a:0};
}

function fmt(sec){
  sec=Math.max(0, Math.round(sec));
  const h=Math.floor(sec/3600), m=Math.floor((sec%3600)/60), s=sec%60;
  const p=n=>(n<10?'0':'')+n;
  return h>0 ? h+':'+p(m)+':'+p(s) : p(m)+':'+p(s);
}

/* «осталось N мин» / «1 ч 35 мин» — как в уведомлении */
function minsTxt(sec){
  let v=Math.max(0, Math.floor((sec||0)/60));
  const h=Math.floor(v/60); v=v-h*60;
  return h>=1 ? (v>0 ? h+' ч '+v+' мин' : h+' ч') : v+' мин';
}

/* HH:MM из минут от 00:00 */
function minsHm(v){
  const h=Math.floor(v/60), r=Math.round(v-h*60);
  return (h<10?'0':'')+h+':'+(r<10?'0':'')+r;
}

function pairsCount(rows){
  const seen={};
  (rows||[]).forEach(function(r){ const n=parseInt(r[0],10); if(n>0) seen[n]=1; });
  return Object.keys(seen).length;
}

function tickTimerDraw(box, rows){
  if(!box) return;
  const plan=buildSegs(rows);
  const now=new Date();
  const mins=now.getHours()*60 + now.getMinutes() + now.getSeconds()/60;
  if(!plan.segs.length){
    box.innerHTML='<span class="tp-text">'+((rows&&rows.length)?'Недостаточно данных':'Пар нет')+'</span>';
    return;
  }
  if(mins >= plan.end){
    const many=pairsCount(rows)>4;
    const mark=many
      ? '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round">'+
        '<path d="M12 5.2v9.4"/><path d="M12 18.6v.01"/></svg>'
      : '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" '+
        'stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">'+
        '<path d="M5 12.6l4.4 4.4L19 7.6"/></svg>';
    box.innerHTML='<span class="tp '+(many?'warn':'done')+'">'+mark+'</span>'+('<span class="tp-text">'+
      (many?'Нет данных по звонкам после 4 пары':'Занятия окончены')+'</span>');
    return;
  }
  let seg=null;
  let total=0;
  for(let i=0;i<plan.segs.length;i++){
    const s2=plan.segs[i];
    if(mins>=s2.a && mins<s2.b){seg=s2;total=(s2.b-s2.a)*60;break;}
  }
  if(!seg){
    seg=plan.segs[plan.segs.length-1];
    total=(seg.b-seg.a)*60;
  }
  const left=(seg.b-mins)*60;
  /* полоса бежит по текущему звену звонков */
  let frac=total>0?(1-left/total):0;
  frac=Math.max(0, Math.min(1, frac));
  const pct=(frac*100).toFixed(1);
  box.innerHTML='<div class="tpb">'
    +'<div class="tpb-top"><span class="tpb-lbl">'+esc(seg.label)+'</span>'
    +'<span class="tpb-val">'+fmt(left)+'</span></div>'
    +'<div class="tpb-track"><div class="tpb-fill" style="width:'+pct+'%"></div></div>'
    +'<div class="tpb-sub"><span>осталось '+minsTxt(left)+'</span><span>до '+minsHm(seg.b)+'</span></div>'
    +'</div>';
}

function startTicker(rows){
  if(window.__tpTimer){clearInterval(window.__tpTimer);window.__tpTimer=null;}
  const box=document.getElementById('tprow');
  if(!box) return;
  tickTimerDraw(box, rows);
  window.__tpTimer=setInterval(function(){tickTimerDraw(box, rows);}, 1000);
}

function renderDay(){
  let t=new Date();
  if(tab==='tomorrow'){ t.setDate(t.getDate()+1); if(t.getDay()===0) t.setDate(t.getDate()+1); }
  if(t.getDay()===0) return '<div class="day">Воскресенье, '+t.getDate()+' '+MONTHS[t.getMonth()]+'</div><div class="empty">Сегодня выходной. Занятий нет.</div>';
  const key=iso(t), e=data.days[key];
  let h='<div class="day">'+(e?esc(e.label):'Нет данных')+'</div>';
  if(!e) return h+'<div class="empty">Расписание на эту дату ещё не собрано. Откройте «Неделя».</div>';
  h+='<div class="sub" style="margin:2px 0 0">'+esc(NAME)+' · неделя '+e.week+' · '+esc(e.kind)+'</div>';
  if(tab==='today') h+='<div class="tp-row" id="tprow"></div>';
  h+=banner(e.status);
  h+=e.rows.length?table(e.rows):'<div class="empty">Пар нет.</div>';
  return h;
}
function renderWeek(){
  let h='<div class="switch"><button id="pn" class="'+(parity==='n'?'on':'')+'">Числитель</button><button id="pz" class="'+(parity==='z'?'on':'')+'">Знаменатель</button></div>';
  const days=data.week[parity]||[];
  const now=new Date(), mon=new Date(now);
  mon.setDate(now.getDate()-((now.getDay()+6)%7));
  days.forEach(function(d,i){
    if(!d.rows.length) return;
    const dt=new Date(mon); dt.setDate(mon.getDate()+i);
    h+='<div class="day">'+esc(d.day)+', '+dt.getDate()+' '+MONTHS[dt.getMonth()]+'</div>'+table(d.rows);
  });
  if(!days.some(d=>d.rows.length)) h+='<div class="empty">Пар нет.</div>';
  return h;
}
function paint(){
  const nextName=(new Date().getDay()===6)?'Понедельник':'Завтра';
  $('#tabs').innerHTML='<button id="b1" class="'+(tab==='today'?'on':'')+'">Сегодня</button>'+
    '<button id="b2" class="'+(tab==='tomorrow'?'on':'')+'">'+nextName+'</button>'+
    '<button id="b3" class="'+(tab==='week'?'on':'')+'">Неделя</button>';
  $('#body').innerHTML=(tab==='week')?renderWeek():renderDay();
  if(tab==='week'){
    if(window.__tpTimer){clearInterval(window.__tpTimer);window.__tpTimer=null;}
  } else {
    const t=new Date(); if(tab==='tomorrow') t.setDate(t.getDate()+1);
    const key=iso(t); const e=data.days[key];
    startTicker(e?e.rows:[]);
  }
  $('#b1').onclick=()=>{tab='today';paint();};
  $('#b2').onclick=()=>{tab='tomorrow';paint();};
  $('#b3').onclick=()=>{tab='week';paint();};
  if(tab==='week'){$('#pn').onclick=()=>{parity='n';paint();};$('#pz').onclick=()=>{parity='z';paint();};}
}
if(MODE==='g'){try{localStorage.setItem('ggpk.group',G);}catch(e){}}
var watchdog=setTimeout(function(){
  if(!data){var b=document.getElementById('body');
    if(b) b.innerHTML='<div class="empty">Долго нет ответа. Проверьте интернет и обновите страницу.</div>';}
},7000);
fetch('../data/'+(MODE==='t'?'p':'g')+'/'+G+'.json?v=202610302343').then(r=>r.json()).then(d=>{data=d;clearTimeout(watchdog);paint();})
 .catch(()=>{clearTimeout(watchdog);$('#body').innerHTML='<div class="empty">Не удалось загрузить расписание.</div>';});

  function pmEl(){return document.getElementById('pmenu');}
  function pmOn(){var p=pmEl();return !!(p&&p.classList.contains('on'));}
  function pmClose(){if(pmOn())pmEl().classList.remove('on');}
  function pmToggle(){
    var p=pmEl(); if(!p) return;
    if(pmOn()){pmClose();return;}
    var act=root.getAttribute('data-accent')||'honey';
    var rows=p.querySelectorAll('[data-ac]');
    for(var i=0;i<rows.length;i++){
      if(rows[i].getAttribute('data-ac')===act){rows[i].classList.add('act');}
      else{rows[i].classList.remove('act');}
    }
    p.classList.add('on');
  }
  function applyAccent(name){
    var s=document.createElement('style');
    s.textContent='*{transition:none!important}';
    document.head.appendChild(s);
    root.setAttribute('data-accent',name||'honey');
    try{localStorage.setItem('ggpk.accent',name||'honey');}catch(e){}

    requestAnimationFrame(function(){requestAnimationFrame(function(){s.parentNode&&s.parentNode.removeChild(s);});});
  }
  function pad(n){return (n<10?'0':'')+n}
  var tmLeft='--:--';
  function tick(){
    var now=new Date(), next=new Date(now);
    next.setMinutes(7,0,0);
    if(next<=now) next.setHours(next.getHours()+1,7,0,0);
    var s=Math.round((next-now)/1000), m=Math.floor(s/60), r=s%60;
    tmLeft=m+':'+(r<10?'0':'')+r;
    var el=document.getElementById('tmt');
    if(el) el.textContent=tmLeft;
  }
  var toastT=null;
  function toast(txt){
    var el=document.getElementById('toast'); if(!el) return;

    if(toastT) clearTimeout(toastT);
    toastT=setTimeout(function(){el.classList.remove('on');},5000);
  }
  document.addEventListener('click',function(e){

    var pr=e.target.closest?e.target.closest('[data-ac]'):null;
    if(pr){applyAccent(pr.getAttribute('data-ac'));pmClose();return;}
    var pm=e.target.closest?e.target.closest('#pmenu'):null;
    if(!pm){pmClose();}
    var tm=e.target.closest?e.target.closest('#tm'):null;
    if(tm){toast('До обновления расписания: '+tmLeft);return;}
    var b=e.target.closest?e.target.closest('[data-modal]'):null;
    if(b){e.preventDefault();openModal(b.getAttribute('data-modal'));return;}
